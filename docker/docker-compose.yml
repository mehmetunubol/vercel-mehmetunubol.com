name: mehmetunubol-local

services:
  web:
    image: node:22-bookworm-slim
    working_dir: /workspace
    command: >
      sh -c "corepack enable &&
             corepack prepare pnpm@10.15.1 --activate &&
             pnpm install --frozen-lockfile=false &&
             pnpm --filter web exec next dev -p 3000 -H 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ..:/workspace
      # Named volumes so the container's node_modules never touch the host's
      # (host modules are built for macOS; the container is Linux).
      - web_root_node_modules:/workspace/node_modules
      - web_app_node_modules:/workspace/apps/web/node_modules
      - web_ui_node_modules:/workspace/packages/ui/node_modules
      - web_config_node_modules:/workspace/packages/config/node_modules
      # Turbopack's dev cache is flaky on Docker Desktop's bind-mount fs
      # (intermittent "Failed to write app endpoint" panics) — keep it on a
      # real volume instead, same reasoning as node_modules above.
      - web_next_cache:/workspace/apps/web/.next

  job-application-helper:
    image: node:22-bookworm-slim
    working_dir: /workspace
    command: >
      sh -c "corepack enable &&
             corepack prepare pnpm@10.15.1 --activate &&
             pnpm install --frozen-lockfile=false &&
             pnpm --filter job-application-helper exec next dev -p 3001 -H 0.0.0.0"
    ports:
      - "3001:3001"
    environment:
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - ../apps/job-application-helper/.env.local
    volumes:
      - ..:/workspace
      # Named volumes so the container's node_modules never touch the host's
      # (host modules are built for macOS; the container is Linux).
      - jah_root_node_modules:/workspace/node_modules
      - jah_app_node_modules:/workspace/apps/job-application-helper/node_modules
      - jah_ui_node_modules:/workspace/packages/ui/node_modules
      - jah_config_node_modules:/workspace/packages/config/node_modules
      # Turbopack's dev cache is flaky on Docker Desktop's bind-mount fs
      # (intermittent "Failed to write app endpoint" panics) — keep it on a
      # real volume instead, same reasoning as node_modules above.
      - jah_next_cache:/workspace/apps/job-application-helper/.next

  yt-note-agent:
    build:
      context: ../../yt-note-agent
    ports:
      - "4000:3000"
    env_file:
      - ../../yt-note-agent/.env
    environment:
      # Publish target inside this container — mounted below from the blog
      # repo's real content dir, so posts land exactly where the site reads them.
      - BLOG_CONTENT_PATH=/blog-content
    volumes:
      - ../apps/web/content/blog:/blog-content
      - ../../yt-note-agent/results:/usr/src/app/results
      - ../../yt-note-agent/transcripts:/usr/src/app/transcripts
      - ../../yt-note-agent/audio:/usr/src/app/audio

volumes:
  web_root_node_modules:
  web_app_node_modules:
  web_ui_node_modules:
  web_config_node_modules:
  web_next_cache:
  jah_root_node_modules:
  jah_app_node_modules:
  jah_ui_node_modules:
  jah_config_node_modules:
  jah_next_cache:
